name: Build & Deploy SkyStream Plugins

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all 17 plugins → dist/
        run: node build.js

      - name: List built artifacts
        run: ls -lah dist/

      - name: Commit & push built artifacts
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f dist/ repo.json
          git diff --staged --quiet && echo "Nothing to commit" || \
            git commit -m "🚀 Build $(date -u +%Y-%m-%dT%H:%M:%SZ) [${GITHUB_SHA::7}]: 17 plugins" && \
            git push

